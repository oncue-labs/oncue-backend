spring:
  application:
    name: oncue-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:oncue;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  error:
    include-message: never

oncue:
  auth:
    signing-secret: ${JWT_SIGNING_SECRET}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT1H}
