spring:
  application:
    name: oncue-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:oncue;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true
    redis:
      enabled: true

oncue:
  features:
    local-test-call-enabled: ${ONCUE_LOCAL_TEST_CALL_ENABLED:false}
  auth:
    signing-secret: ${JWT_SIGNING_SECRET}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT1H}
    x:
      redirect-uri: ${X_REDIRECT_URI:com.oncue.oncuemobile://oauth/x/callback}
  voice:
    base-url: ${VOICE_SERVER_URL:http://localhost:8000}
    service-token: ${VOICE_INTERNAL_SERVICE_TOKEN:}
    # 통화 연결 토큰 전용 RSA PKCS#8 개인키. 직접 값이 파일보다 우선하며 둘 중 하나만 설정한다.
    jwt-private-key: ${VOICE_JWT_PRIVATE_KEY:}
    jwt-private-key-file: ${VOICE_JWT_PRIVATE_KEY_FILE:}
  push:
    apns:
      key-id: ${APNS_KEY_ID:}
      team-id: ${APNS_TEAM_ID:}
      bundle-id: ${APNS_BUNDLE_ID:com.oncue.oncueMobile}
      private-key: ${APNS_PRIVATE_KEY:}
      private-key-file: ${APNS_PRIVATE_KEY_FILE:}
